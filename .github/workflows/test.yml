name: tests

# Pull requests only. Jenkins owns main — see infra/jenkins/Jenkinsfile — but a job on
# */main first sees a bad commit after it has already landed, and this is where merges
# actually happen. Needs no secrets: the offline suite touches neither the network nor
# a credential, so a public-repo runner is enough.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/CODEOWNERS'

concurrency:
  group: tests-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # pytest.ini already pins -m "not live"; passing it again keeps the intent local
      # to this file rather than inherited from a config someone may edit.
      - run: PYTHONPATH=. python -m pytest -m "not live"
