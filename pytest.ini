[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# --strict-markers is the point of this file: without it a typo'd @pytest.mark.livve
# is silently unmarked and the offline suite quietly becomes a network suite.
addopts = --strict-markers -q -m "not live"

markers =
    live: hits Decathlon's UCP/MCP endpoint or storefront feed. Run sequentially, rarely.
